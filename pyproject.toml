[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "End-to-End Hybrid RAG CLI Tool for Academic Research"
readme = "README.md"
license = "MIT"
authors = [
    { name = "JANDEE-cmd" }
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "requests>=2.31",
    "numpy>=1.26",
    "langchain-text-splitters>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "litellm>=1.98.0",
]

[project.scripts]
hrag = "hybrid_rag.cli:app"

[tool.setuptools.packages.find]
include = ["hybrid_rag"]